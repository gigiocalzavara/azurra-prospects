version: "3.8"
services:
  azurra-viral:
    image: ${AZURRA_VIRAL_IMAGE:-ghcr.io/gigiocalzavara/azurra-prospects:latest}
    environment:
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
    networks: [traefik_public]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        failure_action: rollback
      labels:
        - traefik.enable=true
        - traefik.docker.network=${TRAEFIK_NETWORK:-network_public}
        - traefik.http.services.azurra-viral.loadbalancer.server.port=3000
        - traefik.http.routers.azurra-viral.rule=Host(`prospects.azurratech.com.br`)
        - traefik.http.routers.azurra-viral.entrypoints=websecure
        - traefik.http.routers.azurra-viral.tls=true
        - traefik.http.routers.azurra-viral.tls.certresolver=letsencryptresolver
networks:
  traefik_public:
    external: true
    name: ${TRAEFIK_NETWORK:-network_public}
